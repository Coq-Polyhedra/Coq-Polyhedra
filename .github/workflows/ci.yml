name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - 'mathcomp/mathcomp:2.6.0-rocq-prover-9.1'
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          opam_file: 'coq-polyhedra.opam'
          custom_image: ${{ matrix.image }}
          install: |
            startGroup "Install dependencies"
              opam pin add -n -y -k path $PACKAGE $WORKDIR
              opam update -y
              opam install -y -j 2 $PACKAGE --deps-only
              opam install -y -j 2 rocq-bignums  # for enumeration/ (PolyhedraHirsch)
            endGroup
          before_script: |
            startGroup "Workaround permission issue"
              sudo chown -R 1000:1000 .  # the container user is 1000:1000
            endGroup
          script: |
            startGroup "Build the whole development (theories/ and enumeration/)"
              dune build --display=short
            endGroup
            startGroup "Install the opam package"
              opam install -y -v -j 2 $PACKAGE
              opam list
            endGroup
